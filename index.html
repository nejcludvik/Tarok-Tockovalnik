<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarok Točkovalnik</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for standalone JSX transpilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { 
            background-color: #111827; 
            color: #f3f4f6; 
            font-family: system-ui, -apple-system, sans-serif; 
        }
        /* Hide scrollbar for cleaner look on inputs */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const App = () => {
            // State initialization from LocalStorage
            const [players, setPlayers] = useState(() => {
                const saved = localStorage.getItem('tarokPlayersReact');
                return saved ? JSON.parse(saved) : [
                    { id: '1', name: 'Igralec 1', radelci: 3 },
                    { id: '2', name: 'Igralec 2', radelci: 3 },
                    { id: '3', name: 'Igralec 3', radelci: 3 }
                ];
            });

            const [games, setGames] = useState(() => {
                const saved = localStorage.getItem('tarokGamesReact');
                return saved ? JSON.parse(saved) : [];
            });

            const [dealerIndex, setDealerIndex] = useState(() => {
                const saved = localStorage.getItem('tarokDealerReact');
                return saved ? parseInt(saved, 10) : 0;
            });

            const [isModalOpen, setIsModalOpen] = useState(false);
            const [gameInputs, setGameInputs] = useState({});

            // Sync to LocalStorage on change
            useEffect(() => {
                localStorage.setItem('tarokPlayersReact', JSON.stringify(players));
                localStorage.setItem('tarokGamesReact', JSON.stringify(games));
                localStorage.setItem('tarokDealerReact', dealerIndex.toString());
            }, [players, games, dealerIndex]);

            // --- Player Management ---
            const addPlayer = () => {
                if (players.length >= 5) {
                    alert("Največje število igralcev je 5.");
                    return;
                }
                const newId = Date.now().toString();
                setPlayers([...players, { id: newId, name: `Igralec ${players.length + 1}`, radelci: 3 }]);
            };

            const removePlayer = (id) => {
                if (players.length <= 3) {
                    alert("Najmanjše število igralcev je 3.");
                    return;
                }
                setPlayers(players.filter(p => p.id !== id));
            };

            const updatePlayerName = (id, newName) => {
                setPlayers(players.map(p => p.id === id ? { ...p, name: newName } : p));
            };

            // --- Radelci Logic ---
            const addRadelcToAll = () => {
                if (confirm("Želiš vsem igralcem dodati 1 radelc?")) {
                    setPlayers(players.map(p => ({ ...p, radelci: p.radelci + 1 })));
                }
            };

            const adjustRadelc = (id, delta) => {
                setPlayers(players.map(p => {
                    if (p.id === id) {
                        return { ...p, radelci: Math.max(0, p.radelci + delta) };
                    }
                    return p;
                }));
            };

            const resetEverything = () => {
                if (confirm("Res želiš izbrisati vse točke in zgodovino? Igralci in radelci (3) se bodo ponastavili.")) {
                    setGames([]);
                    setDealerIndex(0);
                    setPlayers(players.map(p => ({ ...p, radelci: 3 })));
                }
            };

            // --- Import / Export ---
            const exportState = () => {
                const data = { players, games, dealerIndex };
                const jsonString = JSON.stringify(data, null, 2);
                const blob = new Blob([jsonString], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `tarok_igra_${new Date().toISOString().split('T')[0]}.json`;
                a.click();
                URL.revokeObjectURL(url);
            };

            const importState = (event) => {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (data.players && data.games && data.dealerIndex !== undefined) {
                            setPlayers(data.players);
                            setGames(data.games);
                            setDealerIndex(data.dealerIndex);
                            alert('Igra uspešno uvožena!');
                        } else {
                            alert('Neveljavna datoteka s shranjeno igro.');
                        }
                    } catch (err) {
                        alert('Napaka pri branju datoteke.');
                    }
                };
                reader.readAsText(file);
                // Reset input so the same file can be selected again if needed
                event.target.value = ''; 
            };

            // --- Game Entry Logic ---
            const openGameModal = () => {
                const initialInputs = {};
                players.forEach(p => {
                    initialInputs[p.id] = { points: '', useRadelc: false, status: 'win' };
                });
                setGameInputs(initialInputs);
                setIsModalOpen(true);
            };

            const handleSaveGame = () => {
                const newGame = { id: Date.now(), scores: {}, logs: {} };
                let newPlayers = [...players];
                let hasNonZero = false;

                players.forEach(p => {
                    const input = gameInputs[p.id];
                    let rawVal = parseInt(input.points, 10);
                    if (isNaN(rawVal)) rawVal = 0;
                    if (rawVal !== 0) hasNonZero = true;

                    let finalVal = rawVal;
                    
                    // Smart sign logic
                    if (input.status === 'loss' && finalVal > 0) {
                        finalVal = -finalVal;
                    } else if (input.status === 'win' && finalVal < 0) {
                        finalVal = Math.abs(finalVal);
                    }

                    // Radelc logic
                    if (input.useRadelc) {
                        finalVal = finalVal * 2;
                        
                        // Deduct radelc only if it's a win AND points are positive
                        if (input.status === 'win' && finalVal > 0) {
                            const pIndex = newPlayers.findIndex(np => np.id === p.id);
                            newPlayers[pIndex].radelci = Math.max(0, newPlayers[pIndex].radelci - 1);
                        }
                    }

                    newGame.scores[p.id] = finalVal;
                    newGame.logs[p.id] = {
                        usedRadelc: input.useRadelc,
                        status: input.status,
                        wasZero: rawVal === 0
                    };
                });

                if (!hasNonZero && !confirm("Vsi igralci imajo 0 točk. Želiš shraniti igro?")) {
                    return;
                }

                setGames([...games, newGame]);
                setPlayers(newPlayers);
                setDealerIndex((dealerIndex + 1) % players.length); // Move dealer to the right
                setIsModalOpen(false);
            };

            // --- Calculations ---
            const totalScores = {};
            players.forEach(p => totalScores[p.id] = 0);
            games.forEach(g => {
                players.forEach(p => {
                    if (g.scores[p.id]) totalScores[p.id] += g.scores[p.id];
                });
            });

            return (
                <div className="max-w-5xl mx-auto p-4 md:p-6 pb-24">
                    {/* Header */}
                    <div className="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
                        <h1 className="text-3xl font-bold text-white tracking-wide flex items-center gap-3">
                            <span className="bg-gray-800 p-2 rounded-xl border border-gray-700">🃏</span>
                            Tarok Točkovalnik
                        </h1>
                        <div className="flex flex-wrap gap-2">
                            <button onClick={addPlayer} className="bg-gray-800 border border-gray-700 hover:bg-gray-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                                👥 + Igralec
                            </button>
                            <button onClick={addRadelcToAll} className="bg-amber-700/80 hover:bg-amber-600 text-amber-50 px-4 py-2 rounded-lg text-sm font-medium transition-colors border border-amber-600/50">
                                ⭕ Vsem radelc
                            </button>
                            <button onClick={exportState} className="bg-blue-900/80 hover:bg-blue-800 text-blue-100 px-4 py-2 rounded-lg text-sm font-medium transition-colors border border-blue-800/50">
                                ⬇️ Izvozi
                            </button>
                            <label className="bg-purple-900/80 hover:bg-purple-800 text-purple-100 px-4 py-2 rounded-lg text-sm font-medium transition-colors border border-purple-800/50 cursor-pointer flex items-center">
                                <input type="file" accept=".json" className="hidden" onChange={importState} />
                                ⬆️ Uvozi
                            </label>
                            <button onClick={resetEverything} className="bg-red-900/80 hover:bg-red-800 text-red-100 px-4 py-2 rounded-lg text-sm font-medium transition-colors border border-red-800/50">
                                🔄 Ponastavi
                            </button>
                        </div>
                    </div>

                    {/* Main Ledger Table */}
                    <div className="bg-gray-800/50 rounded-xl shadow-2xl overflow-hidden border border-gray-700">
                        <div className="overflow-x-auto">
                            <table className="w-full text-center border-collapse">
                                <thead>
                                    <tr className="bg-gray-900/80 border-b border-gray-700">
                                        <th className="p-4 w-12 text-gray-500 font-normal border-r border-gray-700/50">#</th>
                                        {players.map((p, index) => (
                                            <th key={p.id} className="p-4 min-w-[160px] border-r border-gray-700/50 last:border-0 align-top">
                                                <div className="flex flex-col items-center gap-3">
                                                    {/* Name Input & Delete */}
                                                    <div className="flex items-center gap-2 w-full justify-center group relative">
                                                        <input 
                                                            type="text" 
                                                            value={p.name}
                                                            onChange={(e) => updatePlayerName(p.id, e.target.value)}
                                                            className="bg-transparent border-b border-transparent hover:border-gray-600 focus:border-blue-500 outline-none text-center text-lg font-bold text-white w-28 transition-colors truncate"
                                                        />
                                                        {players.length > 3 && (
                                                            <button 
                                                                onClick={() => removePlayer(p.id)} 
                                                                className="text-red-500 hover:text-red-400 font-bold opacity-0 group-hover:opacity-100 transition-opacity absolute -right-2 top-0"
                                                                title="Odstrani igralca"
                                                            >×</button>
                                                        )}
                                                    </div>
                                                    
                                                    {/* Dealer & Radelci Controls */}
                                                    <div className="flex items-center justify-center gap-3">
                                                        <span title="Deli" className={`text-xl transition-opacity duration-300 ${index === dealerIndex ? 'opacity-100' : 'opacity-0'}`}>
                                                            🃏
                                                        </span>
                                                        <div className="flex items-center gap-1 bg-gray-900 px-2 py-1 rounded-full border border-gray-700">
                                                            <button onClick={() => adjustRadelc(p.id, -1)} className="text-gray-500 hover:text-white px-1 font-bold">−</button>
                                                            <span className="text-amber-500 font-bold min-w-[32px] text-sm tracking-widest">{p.radelci}⭕</span>
                                                            <button onClick={() => adjustRadelc(p.id, 1)} className="text-gray-500 hover:text-white px-1 font-bold">+</button>
                                                        </div>
                                                    </div>
                                                </div>
                                            </th>
                                        ))}
                                    </tr>
                                </thead>
                                
                                <tbody className="divide-y divide-gray-700/50">
                                    {games.map((g, i) => (
                                        <tr key={g.id} className="hover:bg-gray-750/50 transition-colors">
                                            <td className="p-3 text-gray-500 text-sm border-r border-gray-700/50 bg-gray-900/20">{i + 1}.</td>
                                            {players.map(p => {
                                                const score = g.scores[p.id] || 0;
                                                const log = g.logs[p.id];
                                                const isZero = log && log.wasZero;
                                                return (
                                                    <td key={p.id} className="p-3 border-r border-gray-700/50 last:border-0 h-16">
                                                        {isZero ? (
                                                            <span className="text-gray-600 font-medium">-</span>
                                                        ) : (
                                                            <div className="flex flex-col items-center justify-center">
                                                                <span className={`text-lg font-bold ${score > 0 ? 'text-green-400' : 'text-red-400'}`}>
                                                                    {score > 0 ? `+${score}` : score}
                                                                </span>
                                                                {log && log.usedRadelc && (
                                                                    <span className="text-[10px] text-amber-500/80 mt-0.5 uppercase tracking-wider font-semibold">
                                                                        {log.status === 'win' ? '(Rad ✓)' : '(Rad ✗)'}
                                                                    </span>
                                                                )}
                                                            </div>
                                                        )}
                                                    </td>
                                                );
                                            })}
                                        </tr>
                                    ))}
                                    
                                    {games.length === 0 && (
                                        <tr>
                                            <td colSpan={players.length + 1} className="p-12 text-gray-500 text-sm">
                                                Ni še vpisanih iger.
                                            </td>
                                        </tr>
                                    )}
                                </tbody>

                                <tfoot>
                                    <tr className="bg-gray-900 border-t-2 border-gray-600">
                                        <td className="p-4 text-gray-400 font-bold uppercase text-xs tracking-wider border-r border-gray-700/50">Skupaj</td>
                                        {players.map(p => (
                                            <td key={p.id} className="p-4 border-r border-gray-700/50 last:border-0">
                                                <span className={`text-2xl font-black ${totalScores[p.id] > 0 ? 'text-green-400' : totalScores[p.id] < 0 ? 'text-red-400' : 'text-gray-400'}`}>
                                                    {totalScores[p.id] > 0 ? `+${totalScores[p.id]}` : totalScores[p.id]}
                                                </span>
                                            </td>
                                        ))}
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                    </div>

                    {/* Add Game Button (Floating-ish) */}
                    <div className="mt-8 flex justify-center">
                        <button onClick={openGameModal} className="bg-blue-600 hover:bg-blue-500 text-white px-12 py-4 rounded-2xl text-xl font-bold shadow-[0_0_20px_rgba(37,99,235,0.3)] hover:shadow-[0_0_25px_rgba(37,99,235,0.5)] transform hover:-translate-y-1 transition-all border border-blue-500">
                            ➕ Vpiši Igro
                        </button>
                    </div>

                    {/* Game Entry Modal */}
                    {isModalOpen && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
                            <div className="bg-gray-800 rounded-3xl p-6 md:p-8 w-full max-w-3xl border border-gray-700 shadow-2xl my-auto animate-fade-in">
                                <div className="flex justify-between items-center mb-6 border-b border-gray-700 pb-4">
                                    <h2 className="text-2xl font-bold text-white flex items-center gap-2">
                                        <span>📝</span> Vnos točk nove igre
                                    </h2>
                                    <button onClick={() => setIsModalOpen(false)} className="text-gray-400 hover:text-white text-3xl font-bold leading-none">&times;</button>
                                </div>
                                
                                <div className="space-y-4 max-h-[60vh] overflow-y-auto pr-2">
                                    {players.map(p => (
                                        <div key={p.id} className="bg-gray-750/50 p-4 rounded-2xl border border-gray-700 flex flex-col md:flex-row md:items-center gap-4 hover:border-gray-600 transition-colors">
                                            
                                            {/* Name & Points Input */}
                                            <div className="w-full md:w-1/3">
                                                <label className="block text-sm font-bold text-gray-300 mb-2 truncate">
                                                    {p.name}
                                                    {p.radelci > 0 && <span className="ml-2 text-amber-500 text-xs font-normal">({p.radelci}⭕)</span>}
                                                </label>
                                                <input 
                                                    type="number" 
                                                    placeholder="Točke (0 = nič)"
                                                    value={gameInputs[p.id]?.points}
                                                    onChange={(e) => setGameInputs({...gameInputs, [p.id]: {...gameInputs[p.id], points: e.target.value}})}
                                                    className="w-full bg-gray-900 border border-gray-600 text-white rounded-xl p-3 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none font-bold text-lg"
                                                />
                                            </div>

                                            {/* Options: Radelc & Status */}
                                            <div className="w-full md:w-2/3 flex flex-wrap gap-4 items-center pt-1 md:pt-7 justify-start md:justify-end">
                                                {/* Radelc Checkbox */}
                                                <label className="flex items-center gap-2 cursor-pointer bg-gray-900 px-4 py-3 rounded-xl border border-gray-700 hover:border-amber-600/50 transition-colors select-none">
                                                    <input 
                                                        type="checkbox" 
                                                        checked={gameInputs[p.id]?.useRadelc}
                                                        onChange={(e) => setGameInputs({...gameInputs, [p.id]: {...gameInputs[p.id], useRadelc: e.target.checked}})}
                                                        className="w-5 h-5 rounded border-gray-600 text-amber-500 focus:ring-amber-500 focus:ring-offset-gray-900 bg-gray-800 cursor-pointer"
                                                    />
                                                    <span className="text-gray-200 font-medium text-sm">Radelc (x2)</span>
                                                </label>

                                                {/* Win/Loss Toggle */}
                                                <div className="flex bg-gray-900 p-1.5 rounded-xl border border-gray-700 select-none">
                                                    <label className={`cursor-pointer px-4 py-2 rounded-lg flex items-center gap-2 transition-colors ${gameInputs[p.id]?.status === 'win' ? 'bg-green-900/40 border border-green-700/50' : 'hover:bg-gray-800 border border-transparent'}`}>
                                                        <input 
                                                            type="radio" 
                                                            name={`status-${p.id}`}
                                                            checked={gameInputs[p.id]?.status === 'win'}
                                                            onChange={() => setGameInputs({...gameInputs, [p.id]: {...gameInputs[p.id], status: 'win'}})}
                                                            className="sr-only"
                                                        />
                                                        <span className={`text-sm font-bold ${gameInputs[p.id]?.status === 'win' ? 'text-green-400' : 'text-gray-500'}`}>Zmaga</span>
                                                    </label>
                                                    <label className={`cursor-pointer px-4 py-2 rounded-lg flex items-center gap-2 transition-colors ${gameInputs[p.id]?.status === 'loss' ? 'bg-red-900/40 border border-red-700/50' : 'hover:bg-gray-800 border border-transparent'}`}>
                                                        <input 
                                                            type="radio" 
                                                            name={`status-${p.id}`}
                                                            checked={gameInputs[p.id]?.status === 'loss'}
                                                            onChange={() => setGameInputs({...gameInputs, [p.id]: {...gameInputs[p.id], status: 'loss'}})}
                                                            className="sr-only"
                                                        />
                                                        <span className={`text-sm font-bold ${gameInputs[p.id]?.status === 'loss' ? 'text-red-400' : 'text-gray-500'}`}>Poraz</span>
                                                    </label>
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>

                                <div className="mt-8 flex justify-end gap-3 pt-6 border-t border-gray-700">
                                    <button onClick={() => setIsModalOpen(false)} className="px-6 py-3 rounded-xl text-gray-300 font-bold hover:bg-gray-700 transition-colors">
                                        Prekliči
                                    </button>
                                    <button onClick={handleSaveGame} className="bg-green-600 hover:bg-green-500 text-white px-8 py-3 rounded-xl font-bold shadow-lg transition-colors border border-green-500">
                                        Shrani Igro
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
