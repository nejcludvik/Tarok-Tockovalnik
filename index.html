<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tarok Točkovalnik</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111827">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { background-color: #111827; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [players, setPlayers] = useState(() => {
                const saved = localStorage.getItem('tarokPlayers');
                return saved ? JSON.parse(saved) : [
                    { id: '1', name: 'Igralec 1', radelci: 3 },
                    { id: '2', name: 'Igralec 2', radelci: 3 },
                    { id: '3', name: 'Igralec 3', radelci: 3 }
                ];
            });

            const [games, setGames] = useState(() => {
                const saved = localStorage.getItem('tarokGames');
                return saved ? JSON.parse(saved) : [];
            });

            const [dealerIndex, setDealerIndex] = useState(() => {
                const saved = localStorage.getItem('tarokDealer');
                return saved ? parseInt(saved, 10) : 0;
            });

            const [isModalOpen, setIsModalOpen] = useState(false);
            const [editingGameId, setEditingGameId] = useState(null);
            const [gameInputs, setGameInputs] = useState({});
            const fileInputRef = useRef(null);

            useEffect(() => {
                localStorage.setItem('tarokPlayers', JSON.stringify(players));
                localStorage.setItem('tarokGames', JSON.stringify(games));
                localStorage.setItem('tarokDealer', dealerIndex.toString());
            }, [players, games, dealerIndex]);

            const exportData = () => {
                const data = {
                    players,
                    games,
                    dealerIndex,
                    exportDate: new Date().toISOString()
                };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `tarok_igra_${new Date().toISOString().split('T')[0]}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };

            const importData = (event) => {
                const file = event.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (data.players && data.games) {
                            if (confirm("Uvoz bo prepisal trenutno igro. Želiš nadaljevati?")) {
                                setPlayers(data.players);
                                setGames(data.games);
                                setDealerIndex(data.dealerIndex || 0);
                            }
                        } else {
                            alert("Neveljavna datoteka!");
                        }
                    } catch (err) {
                        alert("Napaka pri branju datoteke!");
                    }
                };
                reader.readAsText(file);
                event.target.value = null; 
            };

            const addPlayer = () => {
                if (players.length >= 5) {
                    alert("Največje število igralcev je 5.");
                    return;
                }
                const newId = Date.now().toString();
                setPlayers([...players, { id: newId, name: `Igralec ${players.length + 1}`, radelci: 3 }]);
            };

            const removePlayer = (id) => {
                if (players.length <= 3) {
                    alert("Najmanjše število igralcev je 3.");
                    return;
                }
                setPlayers(players.filter(p => p.id !== id));
            };

            const updatePlayerName = (id, newName) => {
                setPlayers(players.map(p => p.id === id ? { ...p, name: newName } : p));
            };

            const addRadelcToAll = () => {
                if (confirm("Želiš vsem igralcem dodati 1 radelc?")) {
                    setPlayers(players.map(p => ({ ...p, radelci: p.radelci + 1 })));
                }
            };

            const adjustRadelc = (id, delta) => {
                setPlayers(players.map(p => {
                    if (p.id === id) {
                        return { ...p, radelci: Math.max(0, p.radelci + delta) };
                    }
                    return p;
                }));
            };

            const resetEverything = () => {
                if (confirm("Res želiš izbrisati vse točke in zgodovino? Igralci in radelci (3) se bodo ponastavili.")) {
                    setGames([]);
                    setDealerIndex(0);
                    setPlayers(players.map(p => ({ ...p, radelci: 3 })));
                }
            };

            const openNewGameModal = () => {
                setEditingGameId(null);
                const initialInputs = {};
                players.forEach(p => {
                    initialInputs[p.id] = { 
                        points: '', 
                        status: 'win'
                    };
                });
                setGameInputs(initialInputs);
                setIsModalOpen(true);
            };

            const openEditGameModal = (game) => {
                setEditingGameId(game.id);
                const initialInputs = {};
                players.forEach(p => {
                    const log = game.logs?.[p.id];
                    const rawPoints = log?.rawPoints !== undefined ? log.rawPoints : (Math.abs(game.scores[p.id] || 0));
                    initialInputs[p.id] = {
                        points: rawPoints === 0 ? '' : rawPoints.toString(),
                        status: log?.status || ((game.scores[p.id] || 0) < 0 ? 'loss' : 'win')
                    };
                });
                setGameInputs(initialInputs);
                setIsModalOpen(true);
            };

            const deleteGame = (gameId) => {
                if (!confirm("Res želiš izbrisati to igro iz zgodovine?")) return;
                
                const gameToDelete = games.find(g => g.id === gameId);
                let updatedPlayers = [...players];

                // Če je ta igra izbrisala kakšen radelc, ga vrnemo igralcu
                if (gameToDelete && gameToDelete.logs) {
                    players.forEach(p => {
                        if (gameToDelete.logs[p.id]?.radelcErased) {
                            const idx = updatedPlayers.findIndex(np => np.id === p.id);
                            if (idx !== -1) {
                                updatedPlayers[idx].radelci += 1;
                            }
                        }
                    });
                }

                setPlayers(updatedPlayers);
                setGames(games.filter(g => g.id !== gameId));
            };

            const handleSaveGame = () => {
                let updatedPlayers = [...players];

                // Če urejamo obstoječo igro, najprej povrnemo radelce, ki so bili v tisti igri izbrisani
                if (editingGameId) {
                    const oldGame = games.find(g => g.id === editingGameId);
                    if (oldGame && oldGame.logs) {
                        players.forEach(p => {
                            if (oldGame.logs[p.id]?.radelcErased) {
                                const idx = updatedPlayers.findIndex(np => np.id === p.id);
                                if (idx !== -1) {
                                    updatedPlayers[idx].radelci += 1;
                                }
                            }
                        });
                    }
                }

                const gameRecord = { 
                    id: editingGameId || Date.now(), 
                    scores: {}, 
                    logs: {} 
                };

                players.forEach(p => {
                    const input = gameInputs[p.id] || { points: '', status: 'win' };
                    let rawVal = parseInt(input.points, 10);
                    if (isNaN(rawVal)) rawVal = 0;

                    let finalVal = Math.abs(rawVal);
                    let hasRadelc = updatedPlayers.find(np => np.id === p.id)?.radelci > 0;
                    let radelcErased = false;
                    let usedRadelcMultiplier = false;

                    if (rawVal !== 0 && hasRadelc) {
                        usedRadelcMultiplier = true;
                        finalVal = finalVal * 2; // Avtomatsko podvoji točke, če ima radelc

                        if (input.status === 'win') {
                            // Pri zmagi se radelc pobriše
                            const pIndex = updatedPlayers.findIndex(np => np.id === p.id);
                            if (pIndex !== -1) {
                                updatedPlayers[pIndex].radelci = Math.max(0, updatedPlayers[pIndex].radelci - 1);
                                radelcErased = true;
                            }
                        }
                        // Pri porazu se radelc NE pobriše, točke pa gredo dvojno v minus
                    }

                    if (input.status === 'loss' && finalVal > 0) {
                        finalVal = -finalVal;
                    }

                    gameRecord.scores[p.id] = finalVal;
                    gameRecord.logs[p.id] = {
                        rawPoints: Math.abs(rawVal),
                        usedRadelc: usedRadelcMultiplier,
                        radelcErased: radelcErased,
                        status: input.status,
                        wasZero: rawVal === 0
                    };
                });

                if (editingGameId) {
                    setGames(games.map(g => g.id === editingGameId ? gameRecord : g));
                } else {
                    setGames([...games, gameRecord]);
                    setDealerIndex((dealerIndex + 1) % players.length); // Premik delivca samo pri nova igri
                }

                setPlayers(updatedPlayers);
                setIsModalOpen(false);
                setEditingGameId(null);
            };

            const totalScores = {};
            players.forEach(p => totalScores[p.id] = 0);
            games.forEach(g => {
                players.forEach(p => {
                    if (g.scores[p.id]) totalScores[p.id] += g.scores[p.id];
                });
            });

            return (
                <div className="max-w-4xl mx-auto p-4 md:p-6 pb-24">
                    <div className="flex flex-col gap-4 mb-8">
                        <div className="flex justify-between items-center">
                            <h1 className="text-3xl font-bold text-white tracking-wide">Tarok Točkovalnik</h1>
                            <div className="flex gap-2">
                                <button onClick={exportData} className="bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded-lg text-sm text-white transition-colors" title="Izvozi igro v datoteko">
                                    ⬇️ Izvozi
                                </button>
                                <button onClick={() => fileInputRef.current.click()} className="bg-gray-700 hover:bg-gray-600 px-3 py-1.5 rounded-lg text-sm text-white transition-colors" title="Uvozi igro iz datoteke">
                                    ⬆️ Uvozi
                                </button>
                                <input type="file" accept=".json" ref={fileInputRef} onChange={importData} className="hidden" />
                            </div>
                        </div>

                        <div className="flex flex-wrap gap-2">
                            <button onClick={addPlayer} className="bg-gray-700 hover:bg-gray-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                                + Igralec
                            </button>
                            <button onClick={addRadelcToAll} className="bg-amber-600 hover:bg-amber-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                                ⭕ Vsem radelc
                            </button>
                            <button onClick={resetEverything} className="bg-red-900 hover:bg-red-800 text-red-100 px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                                Ponastavi
                            </button>
                        </div>
                    </div>

                    <div className="bg-gray-800 rounded-xl shadow-2xl overflow-hidden border border-gray-700">
                        <div className="overflow-x-auto">
                            <table className="w-full text-center">
                                <thead>
                                    <tr className="bg-gray-900 border-b border-gray-700">
                                        <th className="p-4 w-16 text-gray-500 font-normal">#</th>
                                        {players.map((p, index) => (
                                            <th key={p.id} className="p-4 min-w-[140px]">
                                                <div className="flex flex-col items-center gap-2">
                                                    <div className="flex items-center gap-2 w-full justify-center">
                                                        <input 
                                                            type="text" 
                                                            value={p.name}
                                                            onChange={(e) => updatePlayerName(p.id, e.target.value)}
                                                            className="bg-transparent border-b border-gray-600 focus:border-blue-500 outline-none text-center text-lg font-bold text-white w-24 transition-colors"
                                                        />
                                                        {players.length > 3 && (
                                                            <button onClick={() => removePlayer(p.id)} className="text-red-500 hover:text-red-400 font-bold">×</button>
                                                        )}
                                                    </div>
                                                    
                                                    <div className="flex items-center justify-center gap-3">
                                                        {index === dealerIndex && (
                                                            <span title="Deli" className="text-xl">🃏</span>
                                                        )}
                                                        <div className="flex items-center gap-1 bg-gray-800 px-2 py-1 rounded-full border border-gray-600">
                                                            <button onClick={() => adjustRadelc(p.id, -1)} className="text-gray-400 hover:text-white px-1 w-6 h-6 flex items-center justify-center">-</button>
                                                            <span className="text-amber-500 font-bold min-w-[20px]">{p.radelci}⭕</span>
                                                            <button onClick={() => adjustRadelc(p.id, 1)} className="text-gray-400 hover:text-white px-1 w-6 h-6 flex items-center justify-center">+</button>
                                                        </div>
                                                    </div>
                                                </div>
                                            </th>
                                        ))}
                                        <th className="p-4 w-16 text-gray-500 font-normal">Uredi</th>
                                    </tr>
                                </thead>
                                
                                <tbody className="divide-y divide-gray-700">
                                    {games.map((g, i) => (
                                        <tr key={g.id} className="hover:bg-gray-750 transition-colors">
                                            <td className="p-3 text-gray-500 text-sm font-medium">{i + 1}.</td>
                                            {players.map(p => {
                                                const score = g.scores[p.id] || 0;
                                                const log = g.logs[p.id];
                                                const isZero = log && log.wasZero;
                                                return (
                                                    <td key={p.id} className="p-3">
                                                        {isZero ? (
                                                            <span className="text-gray-600 font-medium">-</span>
                                                        ) : (
                                                            <div className="flex flex-col items-center">
                                                                <span className={`text-lg font-bold ${score > 0 ? 'text-green-400' : 'text-red-400'}`}>
                                                                    {score > 0 ? `+${score}` : score}
                                                                </span>
                                                                {log && log.usedRadelc && (
                                                                    <span className="text-[10px] text-amber-500 mt-0.5 uppercase tracking-wider font-semibold">
                                                                        {log.radelcErased ? '(Radelc x2 ✓)' : '(Radelc x2)'}
                                                                    </span>
                                                                )}
                                                            </div>
                                                        )}
                                                    </td>
                                                );
                                            })}
                                            <td className="p-3">
                                                <div className="flex items-center justify-center gap-2">
                                                    <button onClick={() => openEditGameModal(g)} className="text-gray-400 hover:text-blue-400 p-1" title="Uredi igro">
                                                        ✏️
                                                    </button>
                                                    <button onClick={() => deleteGame(g.id)} className="text-gray-400 hover:text-red-400 p-1" title="Izbriši igro">
                                                        🗑️
                                                    </button>
                                                </div>
                                            </td>
                                        </tr>
                                    ))}
                                    {games.length === 0 && (
                                        <tr>
                                            <td colSpan={players.length + 2} className="p-8 text-gray-500 italic">
                                                Ni še vpisanih iger. Klikni "+ Vpiši Igro".
                                            </td>
                                        </tr>
                                    )}
                                </tbody>

                                <tfoot>
                                    <tr className="bg-gray-900 border-t-2 border-gray-600">
                                        <td className="p-4 text-gray-400 font-bold uppercase text-sm">Skupaj</td>
                                        {players.map(p => (
                                            <td key={p.id} className="p-4">
                                                <span className={`text-2xl font-black ${totalScores[p.id] > 0 ? 'text-green-400' : totalScores[p.id] < 0 ? 'text-red-400' : 'text-gray-400'}`}>
                                                    {totalScores[p.id] > 0 ? `+${totalScores[p.id]}` : totalScores[p.id]}
                                                </span>
                                            </td>
                                        ))}
                                        <td></td>
                                    </tr>
                                </tfoot>
                            </table>
                        </div>
                    </div>

                    <div className="fixed bottom-6 left-0 right-0 flex justify-center z-40 px-4">
                        <button onClick={openNewGameModal} className="bg-blue-600 hover:bg-blue-500 text-white w-full max-w-sm py-4 rounded-full text-xl font-bold shadow-2xl border-2 border-blue-400/20 transform hover:scale-105 transition-all">
                            + Vpiši Igro
                        </button>
                    </div>

                    {isModalOpen && (
                        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 overflow-y-auto">
                            <div className="bg-gray-800 rounded-2xl p-6 w-full max-w-2xl border border-gray-700 shadow-2xl my-auto">
                                <div className="flex justify-between items-center mb-6 border-b border-gray-700 pb-4">
                                    <h2 className="text-2xl font-bold text-white">
                                        {editingGameId ? 'Uredi vnos igre' : 'Vnos točk nove igre'}
                                    </h2>
                                    <button onClick={() => { setIsModalOpen(false); setEditingGameId(null); }} className="text-gray-400 hover:text-white text-3xl font-bold p-2 leading-none">&times;</button>
                                </div>
                                
                                <div className="space-y-4">
                                    {players.map(p => {
                                        const playerRadelci = p.radelci;
                                        const hasRadelc = playerRadelci > 0;
                                        return (
                                            <div key={p.id} className="bg-gray-750 p-4 rounded-xl border border-gray-600 flex flex-col md:flex-row md:items-center gap-4">
                                                <div className="w-full md:w-1/2">
                                                    <div className="flex items-center justify-between mb-2">
                                                        <label className="text-sm font-bold text-gray-300">{p.name}</label>
                                                        {hasRadelc && (
                                                            <span className="text-xs bg-amber-500/20 text-amber-400 border border-amber-500/40 px-2 py-0.5 rounded-full font-bold">
                                                                Avto x2 (Ima radelc ⭕)
                                                            </span>
                                                        )}
                                                    </div>
                                                    <input 
                                                        type="number" 
                                                        inputMode="numeric"
                                                        placeholder="Vpiši osnova točke (npr. 40)"
                                                        value={gameInputs[p.id]?.points || ''}
                                                        onChange={(e) => setGameInputs({...gameInputs, [p.id]: {...gameInputs[p.id], points: e.target.value}})}
                                                        className="w-full bg-gray-900 border border-gray-600 text-white rounded-lg p-3 focus:ring-2 focus:ring-blue-500 focus:outline-none text-lg"
                                                    />
                                                </div>

                                                <div className="w-full md:w-1/2 flex flex-col justify-center pt-2 md:pt-6">
                                                    <div className="flex gap-4 bg-gray-900 p-2 rounded-lg border border-gray-700 w-full justify-around">
                                                        <label className="flex items-center gap-2 cursor-pointer p-1">
                                                            <input 
                                                                type="radio" 
                                                                name={`status-${p.id}`}
                                                                checked={gameInputs[p.id]?.status === 'win'}
                                                                onChange={() => setGameInputs({...gameInputs, [p.id]: {...gameInputs[p.id], status: 'win'}})}
                                                                className="w-5 h-5 text-green-500 bg-gray-800 border-gray-600 focus:ring-green-500"
                                                            />
                                                            <span className={`text-sm font-bold ${gameInputs[p.id]?.status === 'win' ? 'text-green-400' : 'text-gray-500'}`}>Zmaga</span>
                                                        </label>
                                                        <label className="flex items-center gap-2 cursor-pointer p-1">
                                                            <input 
                                                                type="radio" 
                                                                name={`status-${p.id}`}
                                                                checked={gameInputs[p.id]?.status === 'loss'}
                                                                onChange={() => setGameInputs({...gameInputs, [p.id]: {...gameInputs[p.id], status: 'loss'}})}
                                                                className="w-5 h-5 text-red-500 bg-gray-800 border-gray-600 focus:ring-red-500"
                                                            />
                                                            <span className={`text-sm font-bold ${gameInputs[p.id]?.status === 'loss' ? 'text-red-400' : 'text-gray-500'}`}>Poraz</span>
                                                        </label>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>

                                <div className="mt-8 flex justify-end gap-3 pt-4 border-t border-gray-700">
                                    <button onClick={() => { setIsModalOpen(false); setEditingGameId(null); }} className="px-6 py-3 rounded-lg text-gray-300 font-bold hover:bg-gray-700 transition-colors">
                                        Prekliči
                                    </button>
                                    <button onClick={handleSaveGame} className="bg-green-600 hover:bg-green-500 text-white px-8 py-3 rounded-lg font-bold shadow-lg transition-colors">
                                        {editingGameId ? 'Shrani Spremembe' : 'Shrani Igro'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => console.log('ServiceWorker registration successful'))
                    .catch(err => console.log('ServiceWorker registration failed: ', err));
            });
        }
    </script>
</body>
</html>
